name: LLM Quality & Safety Evaluation

on:
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "0 2 * * *" # Nightly evaluation at 02:00 UTC
  workflow_dispatch:
    inputs:
      eval_mode:
        description: "Evaluation Mode"
        required: true
        default: "mock_subset"
        type: choice
        options:
          - mock_subset
          - full_nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-eval:
    name: LLM Quality & Security Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./app[dev]"
          pip install -e "./qa[dev]"

      - name: Install Node dependencies for Promptfoo
        run: |
          cd qa && npm install

      - name: Determine Evaluation Scope (PR Fast Subset vs Nightly Full)
        id: eval-scope
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.eval_mode }}" = "full_nightly" ]; then
            echo "mode=full_nightly" >> $GITHUB_OUTPUT
            echo "sample_size=30" >> $GITHUB_OUTPUT
            echo "Running FULL nightly LLM evaluation suite..."
          else
            echo "mode=mock_subset" >> $GITHUB_OUTPUT
            echo "sample_size=6" >> $GITHUB_OUTPUT
            echo "Running FAST cached/MOCK subset for pull request..."
          fi

      - name: Run DeepEval RAG Quality Suite
        env:
          LLM_PROVIDER: mock
          DEEPEVAL_GATES_PATH: qa/config/gates.yaml
          EVAL_SAMPLE_SIZE: ${{ steps.eval-scope.outputs.sample_size }}
        run: |
          python -m qa.llm_eval.deepeval_tests.test_deepeval_suite || true

      - name: Start Mock Backend for Promptfoo Security Eval
        env:
          LLM_PROVIDER: mock
          REQUIRE_API_KEY: "false"
          PYTHONPATH: app
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Run Promptfoo Adversarial Security Evaluation
        env:
          LLM_PROVIDER: mock
        run: |
          python qa/llm_eval/promptfoo/run_security_eval.py || true

      - name: Enforce Quality Gates
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/quality_gate.py \
            --gates qa/config/gates.yaml \
            --history-file results/history.csv \
            --chart-file results/trend_chart.png

      - name: Upload Evaluation Reports and Trends
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-artifacts
          path: |
            results/
            qa/allure-results/
          retention-days: 14
