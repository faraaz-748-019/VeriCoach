name: Mobile Automation (Android)

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-tests:
    name: Android Emulator & Appium Tests
    # macOS runner provides nested virtualization / hardware acceleration for Android emulators
    runs-on: macos-13
    # Allowed to fail without blocking the pipeline
    continue-on-error: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./app[dev]"
          pip install -e "./qa[dev]"

      - name: Install Appium and UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: Start Appium Server in Background
        run: |
          nohup appium --port 4723 --relaxed-security > appium.log 2>&1 &
          sleep 4

      - name: Run Android Emulator and Execute Mobile Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            pytest qa/mobile -v --alluredir=qa/allure-results || true

      - name: Upload Mobile Test Logs and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-artifacts
          path: |
            qa/allure-results/
            appium.log
          retention-days: 7
