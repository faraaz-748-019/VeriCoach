[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vericoach-qa"
version = "0.1.0"
description = "VeriCoach - quality engineering platform"
requires-python = ">=3.11"
dependencies = [
    "vericoach-app",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.5.0",
    "allure-pytest>=2.13.0",
    "httpx>=0.27",
    "faker>=24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.42.0",
    "axe-core-python>=0.1.0",
    "selenium>=4.20.0",
    "Appium-Python-Client>=4.0.0",
    "jsonschema>=4.20",
    "schemathesis>=4.0",
    "ragas>=0.4.0",
    "deepeval>=4.3.0",
    "pyyaml>=6.0",
    "datasets>=2.19.0",
    "diskcache>=5.6.0",
    "langchain-community>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["qa"]

[tool.pytest.ini_options]
testpaths = ["tests", "mobile", "llm_eval/deepeval_tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --alluredir=allure-results"
markers = [
    "smoke: Quick verification of critical system pathways",
    "regression: Full regression test coverage across all features",
    "api: Direct REST API endpoint contracts and payloads",
    "web: Browser and web UI page object tests",
    "mobile: Mobile device interaction and screen object tests",
    "llm: LLM prompt evaluation, safety, and guardrail validations",
    "security: Data privacy, synthetic PII enforcement, and injection tests",
]

[tool.ruff]
extend = "../pyproject.toml"

[tool.black]
target-version = ["py311"]
line-length = 88
extend-exclude = '''
/(
    \.venv
  | \.pytest_cache
  | \.ruff_cache
  | allure-results
  | allure-report
)/
'''
