[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vericoach-qa"
version = "0.1.0"
description = "VeriCoach – quality engineering platform"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

