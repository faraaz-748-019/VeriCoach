[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vericoach-qa"
version = "0.1.0"
description = "VeriCoach - quality engineering platform"
requires-python = ">=3.11"
dependencies = [
    "vericoach-app",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "faker>=24.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
extend = "../pyproject.toml"

[tool.black]
target-version = ["py311"]
line-length = 88

