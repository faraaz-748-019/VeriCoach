[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vericoach-app"
version = "0.1.0"
description = "VeriCoach – multilingual personal-finance assistant"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "faker>=24.0",
    "httpx>=0.27",
    "google-generativeai>=0.8.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "faiss-cpu>=1.8",
    "tiktoken>=0.7",
    "tenacity>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
extend = "../pyproject.toml"

[tool.black]
target-version = ["py311"]
line-length = 88
